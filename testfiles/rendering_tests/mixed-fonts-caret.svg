<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340">
  <title>Review: relative TTF files, mixed spans — three faces on one line</title>
  <defs>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: "Logo";
        font-weight: normal;
        font-style: normal;
        src: url("fonts/Fondamento.ttf") format("truetype");
      }
      @font-face {
        font-family: "Bogo";
        font-weight: normal;
        font-style: normal;
        src: url("fonts/Creepster-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Fogo";
        font-weight: normal;
        font-style: normal;
        src: url("fonts/Monoton-Regular.ttf") format("truetype");
      }
      .caption {
        font-family: sans-serif;
        font-size: 14px;
        fill: #555555;
      }
      .note {
        font-family: sans-serif;
        font-size: 13px;
        fill: #1a1a1a;
      }
    ]]></style>
  </defs>
  <rect width="100%" height="100%" fill="#f4f1e8"/>
  <text class="note" x="32" y="28">Purpose: local relative TTF (fonts/*.ttf next to this SVG) in one mixed-span text object.</text>
  <text class="note" x="32" y="48">Pass: Logo (Fondamento) script, Bogo display, Fogo geometric on the same line. Captions stay sans.</text>
  <text class="caption" x="32" y="68">Fail: all three words look like the same sans. Caret / font-dialog following mixed spans is a later MR.</text>
  <text xml:space="preserve" x="32" y="170" style="font-size:48px;fill:#111111;font-family:Logo, sans-serif;-inkscape-font-specification:'Logo, Normal'"><tspan style="font-family:Logo, sans-serif;-inkscape-font-specification:'Logo, Normal'">Logo </tspan><tspan style="font-family:Bogo, sans-serif;-inkscape-font-specification:'Bogo, Normal'">Bogo </tspan><tspan style="font-family:Fogo, sans-serif;font-size:36px;-inkscape-font-specification:'Fogo, Normal'">Fogo</tspan></text>
  <text class="caption" x="32" y="220">One text object: Logo 48px + Bogo 48px + Fogo 36px.</text>
</svg>
